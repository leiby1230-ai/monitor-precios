<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestión de alertas de precio por umbral en PrecioAlerta.">
    <title>PrecioAlerta · Mis Alertas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="brand">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2"
                aria-hidden="true">
                <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline>
                <polyline points="16 17 22 17 22 11"></polyline>
            </svg>
            <span>PrecioAlerta</span>
        </a>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menú">Menú</button>
        <nav aria-label="Navegación principal">
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">Ofertas</a></li>
                <li><a href="producto.html" class="nav-link">Histórico</a></li>
                <li><a href="alertas.html" class="nav-link active">Mis Alertas</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Crear Alerta por Umbral</h1>
            <form id="alertForm" class="toolbar" style="margin-top: 1rem;">
                <input type="text" id="alertProduct" class="input" placeholder="Nombre del producto"
                    aria-label="Nombre del producto" required>
                <input type="number" id="alertTarget" class="input" placeholder="Precio objetivo ($)"
                    aria-label="Precio objetivo" min="1" required>
                <button class="btn" type="submit">Guardar Alerta</button>
            </form>
        </section>

        <section class="card" aria-label="Lista de alertas configuradas">
            <h2>Alertas Activas</h2>
            <div class="table-wrap" style="margin-top: 1rem;">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio Actual</th>
                            <th>Umbral Objetivo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="alertBody">
                        <tr>
                            <td>Monitor IPS 27" 144Hz</td>
                            <td>$189.00</td>
                            <td>$195.00</td>
                            <td><span class="badge badge-ok">Alerta Disparada</span></td>
                        </tr>
                        <tr>
                            <td>Audífonos Bluetooth ANC</td>
                            <td>$65.00</td>
                            <td>$55.00</td>
                            <td><span class="badge badge-warn">Monitoreando</span></td>
                        </tr>
                        <tr>
                            <td>Freidora de Aire 5L</td>
                            <td>$82.00</td>
                            <td>$75.00</td>
                            <td><span class="badge badge-warn">Monitoreando</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
