<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gráfico de evolución histórica de precios en PrecioAlerta.">
    <title>PrecioAlerta · Histórico de Precios</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="brand">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2"
                aria-hidden="true">
                <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline>
                <polyline points="16 17 22 17 22 11"></polyline>
            </svg>
            <span>PrecioAlerta</span>
        </a>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menú">Menú</button>
        <nav aria-label="Navegación principal">
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">Ofertas</a></li>
                <li><a href="producto.html" class="nav-link active">Histórico</a></li>
                <li><a href="alertas.html" class="nav-link">Mis Alertas</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Monitor IPS 27" 144Hz</h1>
            <p class="muted">Evolución de precio con línea de umbral objetivo ($195.00)</p>

            <div class="grid-cards" style="margin: 1rem 0;">
                <div class="card">
                    <p class="muted">Precio Actual</p>
                    <p class="price-now">$189.00</p>
                </div>
                <div class="card">
                    <p class="muted">Mínimo Histórico</p>
                    <p style="font-size: 1.4rem; font-weight: 700;">$179.00</p>
                </div>
                <div class="card">
                    <p class="muted">Máximo Histórico</p>
                    <p style="font-size: 1.4rem; font-weight: 700;">$259.00</p>
                </div>
            </div>

            <div class="toolbar">
                <button class="btn btn-outline range-btn" type="button" data-range="30d">30 días</button>
                <button class="btn btn-outline range-btn" type="button" data-range="90d">90 días</button>
                <button class="btn btn-outline range-btn" type="button" data-range="todo">Todo</button>
                <span class="muted" id="rangeLabel">Últimos 30 días · Mínimo: $189.00</span>
            </div>

            <div class="chart-box">
                <svg viewBox="0 0 600 180" width="100%" height="180" role="img"
                    aria-label="Gráfico de evolución histórica del precio">
                    <line x1="40" y1="150" x2="560" y2="150" stroke="#cbd5e1" stroke-width="1"></line>
                    <line x1="40" y1="80" x2="560" y2="80" stroke="#059669" stroke-width="2" stroke-dasharray="6,4">
                    </line>
                    <text x="45" y="74" fill="#059669" font-size="12">Umbral objetivo ($195)</text>
                    <polyline id="chartLine" fill="none" stroke="#4f46e5" stroke-width="3"
                        points="40,140 140,120 240,130 340,95 440,80 540,65"></polyline>
                </svg>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
